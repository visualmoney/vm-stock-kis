name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs가 태그에서 버전을 읽으려면 전체 히스토리가 필요합니다.
          # 없으면 fallback-version("0.0.0")인 아티팩트가 만들어집니다.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build
        run: uv build

      # 태그와 실제로 빌드된 버전이 일치하는지 확인합니다.
      # hatch-vcs가 태그를 못 읽으면 여기서 멈춥니다.
      - name: Tag matches built version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.whl | sed -E 's/.*vm_stock_kis-([^-]+)-.*/\1/')
          echo "tag=$tag built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::태그($tag)와 빌드 버전($built)이 다릅니다"
            exit 1
          fi

      - name: Metadata check
        run: uvx --from 'twine>=6' twine check --strict dist/*

      # 휠 내용 검증. 이름 변경 이후 옛 패키지가 섞여 들어가거나
      # py.typed가 빠지는 회귀를 잡습니다.
      - name: Wheel contents
        run: |
          python - <<'PY'
          import glob, sys, zipfile

          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          problems = []

          if "vmkis/py.typed" not in names:
              problems.append("vmkis/py.typed 누락 (Typing :: Typed classifier와 어긋남)")
          if any(n.startswith("pykis/") for n in names):
              problems.append("옛 패키지 pykis/ 가 휠에 포함됨")
          if any(n.startswith("tests/") for n in names):
              problems.append("tests/ 가 휠에 포함됨")

          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)

          print("휠 내용 정상:", sorted({n.split("/")[0] for n in names}))
          PY

      # 격리 환경에서 실제로 import되는지 확인합니다.
      # 런타임 의존성 누락(예: pyyaml)을 여기서 잡습니다.
      - name: Smoke test the wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python - <<'PY'
          import vmkis
          from vmkis import VmKis

          print(vmkis.__file__, vmkis.__version__)

          assert not vmkis.__version__.startswith("0.0.0"), "버전이 fallback 값입니다"
          assert vmkis.create_client is not None, "helpers import 실패 (런타임 의존성 확인)"
          assert vmkis.SimpleKIS is not None
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vm-stock-kis
    permissions:
      # trusted publishing (OIDC) 및 PEP 740 attestations
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
